openapi: 3.0.3
info:
  title: API de Renta de Autos (Enriquecida v2)
  description: |
    Microservicio y API Gateway de Renta de Autos del Marketplace Booking Prototipo (RDA2).
    Evolución a especificación v2.0.0 con soporte para:
    - Búsqueda avanzada con tramos horarios de 30 minutos, autocompletado y validación de conductor novel (<25 años).
    - Filtros por categoría de vehículo (Económico, Compacto, Familiar, SUV, Premium, Van) y transmisión.
    - Coberturas diferenciadas (Protección Básica con franquicia vs Cobertura Total sin franquicia).
    - Máquina de estados del vehículo con cooldown obligatorio de 2 horas post-limpieza (Consideraciones RDA2 §5).
    - Módulo y rol técnico de mantenimiento vehicular con auditoría de odómetro y alerta preventiva.
    - Check-in digital de autos y emisión de Voucher Digital con Código QR.
    - Sincronización Inbound de inventario y flota en tiempo real mediante gRPC / HTTP/2 (Protocol Buffers en src/proto/inventory.proto, puerto 50051).
    - Respuestas de error enriquecidas bajo RFC 7807 (Problem Details).
    - Resiliencia e idempotencia obligatorias (Idempotency-Key, X-Correlation-Id).
  version: 2.0.0
servers:
  - url: /api/v2
    description: API Gateway - Ruta base v2 (RDA2)
  - url: /api/v1
    description: API Gateway - Ruta legacy v1 (Compatibilidad hacia atrás)
tags:
  - name: Autos - Catálogo y Búsqueda v2
    description: Búsqueda, disponibilidad, filtrado por categorías y especificaciones de flota
  - name: Autos - Reservas y Check-in v2
    description: Creación de reservas con Idempotency-Key, coberturas y emisión de voucher QR
  - name: Autos - Mantenimiento y Operaciones v2
    description: Endpoints técnicos protegidos para registro de odómetro, cooldown de limpieza y alertas preventivas

paths:
  /autos/search:
    post:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Búsqueda de vehículos disponibles (Catálogo Híbrido)
      description: |
        Consulta vehículos disponibles en el punto de recogida.
        Aplica filtro de exclusión automática para vehículos en estado 'RESERVADO' o en ciclo de limpieza ('EN_LIMPIEZA' dentro del cooldown de 2 horas).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAutosRequestV2'
      responses:
        '200':
          description: Lista de vehículos disponibles recuperada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAutosResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '503':
          $ref: '#/components/responses/ProblemDetails503'

  /autos/{id}/coberturas:
    get:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Consultar opciones de cobertura y seguros para un vehículo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'auto-spark-01'
      responses:
        '200':
          description: Opciones de cobertura (Básica vs Cobertura Total)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoberturasResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /autos/{id}:
    get:
      tags:
        - Autos - Catálogo y Búsqueda v2
      summary: Consultar detalle técnico de un vehículo por ID
      description: Retorna ficha técnica completa, imágenes, política de combustible, kilometraje y estado operativo actual.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'auto-spark-01'
      responses:
        '200':
          description: Detalle del vehículo recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoVehiculoCardV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /autos/orders/create:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Crear reserva de vehículo con Idempotency-Key y Cobertura
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: '9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d'
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
          example: 'corr-autos-987654'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoOrderRequestV2'
      responses:
        '201':
          description: Reserva creada y confirmada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '503':
          $ref: '#/components/responses/ProblemDetails503'

  /autos/reservas/{id}/checkin:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Check-in digital anticipado para entrega rápida de llaves
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'res-auto-7762'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - numero_licencia
                - documento_identidad
              properties:
                numero_licencia:
                  type: string
                  example: '1723456789'
                documento_identidad:
                  type: string
                  example: '1723456789'
                fecha_vencimiento_licencia:
                  type: string
                  format: date
                  example: '2028-12-31'
      responses:
        '200':
          description: Check-in validado exitosamente con voucher digital activado
          content:
            application/json:
              schema:
                type: object
                properties:
                  reserva_id:
                    type: string
                  checkin_status:
                    type: string
                    example: 'CHECKIN_COMPLETED'
                  fast_track_pickup:
                    type: boolean
                    example: true
                  voucher_qr_data:
                    type: string
                    example: 'AUTOS-CHECKIN-1723456789-VALID'

  /autos/orders/{orderId}:
    get:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Consultar orden o reserva de auto por ID o PNR
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: 'CAR7849B'
      responses:
        '200':
          description: Detalle de la orden de renta recuperado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /autos/orders/{orderId}/cancel:
    post:
      tags:
        - Autos - Reservas y Check-in v2
      summary: Cancelar una orden de renta de auto existente
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: 'CAR7849B'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: '8b2ceb4d-3b7d-4bad-9bdd-2b0d7b3dcb7e'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: 'Cancelación solicitada por el cliente por cambio de planes'
      responses:
        '200':
          description: Orden cancelada exitosamente y vehículo liberado a DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoOrderResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

  /autos/{id}/devolucion:
    post:
      tags:
        - Autos - Mantenimiento y Operaciones v2
      summary: Registrar devolución del vehículo e iniciar Cooldown de Limpieza de 2 Horas
      description: |
        Cambia el estado del vehículo a 'EN_LIMPIEZA' y fija el timestamp 'disponible_desde = NOW() + 2 HORAS'.
        Durante este lapso, el auto es invisible para los buscadores públicos.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'auto-spark-01'
      responses:
        '200':
          description: Devolución procesada y cooldown de 2 horas iniciado
          content:
            application/json:
              schema:
                type: object
                properties:
                  auto_id:
                    type: string
                  estado:
                    type: string
                    example: 'EN_LIMPIEZA'
                  cooldown_horas:
                    type: integer
                    example: 2
                  disponible_desde:
                    type: string
                    format: date-time
                    example: '2026-10-14T21:30:00Z'
                  mensaje:
                    type: string
                    example: 'Vehículo en ciclo de limpieza y desinfección. Estará disponible en 2 horas.'

  /autos/{id}/mantenimiento/registro:
    post:
      tags:
        - Autos - Mantenimiento y Operaciones v2
      summary: Registro de odómetro, revisión física y alerta preventiva (Rol Técnico)
      description: |
        Endpoint protegido para el rol 'tecnico_mantenimiento'.
        Evalúa si 'kilometraje_actual >= proximo_mantenimiento_km' para activar alertas operativas.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 'auto-spark-01'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroMantenimientoRequestV2'
      responses:
        '200':
          description: Registro de mantenimiento asentado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroMantenimientoResponseV2'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

components:
  schemas:
    SearchAutosRequestV2:
      type: object
      required:
        - pickup_location
        - pickup_date
        - pickup_time
        - dropoff_date
        - dropoff_time
      properties:
        pickup_location:
          type: string
          example: 'Aeropuerto Mariscal Sucre (UIO), Quito'
        dropoff_location:
          type: string
          example: 'Aeropuerto Mariscal Sucre (UIO), Quito'
        pickup_date:
          type: string
          format: date
          example: '2026-10-20'
        pickup_time:
          type: string
          example: '10:00'
        dropoff_date:
          type: string
          format: date
          example: '2026-10-23'
        dropoff_time:
          type: string
          example: '10:00'
        driver_age:
          type: integer
          example: 32
        driver_age_bracket:
          type: boolean
          description: True si conductor está entre 30 y 65 años
          default: true
        category:
          type: string
          enum: [ALL, ECONOMICO, COMPACTO, FAMILIAR, SUV, PREMIUM, VAN]
          default: ALL
        transmission:
          type: string
          enum: [ALL, MANUAL, AUTOMATICO]
          default: ALL

    SearchAutosResponseV2:
      type: object
      properties:
        request_id:
          type: string
        metadata:
          type: object
          properties:
            total_results:
              type: integer
            surcharge_applied:
              type: boolean
              description: Aplica si edad < 25 o > 70
        data:
          type: array
          items:
            $ref: '#/components/schemas/AutoVehiculoCardV2'

    AutoVehiculoCardV2:
      type: object
      properties:
        vehicle_id:
          type: string
          example: 'auto-spark-01'
        marca:
          type: string
          example: 'Chevrolet'
        modelo:
          type: string
          example: 'Spark GT'
        categoria:
          type: string
          example: 'ECONOMICO'
        precio_diario:
          type: number
          format: float
          example: 35.50
        precio_total:
          type: number
          format: float
          example: 106.50
        moneda:
          type: string
          example: 'USD'
        transmision:
          type: string
          example: 'MANUAL'
        asientos:
          type: integer
          example: 5
        puertas:
          type: integer
          example: 4
        maletas_grandes:
          type: integer
          example: 1
        maletas_pequenas:
          type: integer
          example: 1
        aire_acondicionado:
          type: boolean
          example: true
        kilometraje_ilimitado:
          type: boolean
          example: true
        politica_combustible:
          type: string
          example: 'LLENO_A_LLENO'
        cancelacion_gratuita:
          type: boolean
          example: true
        proveedor:
          type: object
          properties:
            nombre:
              type: string
              example: 'Europcar'
            rating:
              type: number
              example: 8.4
            ubicacion:
              type: string
              example: 'En la terminal aérea'
        estado:
          type: string
          enum: [DISPONIBLE, RESERVADO, ENTREGADO, EN_LIMPIEZA]
          example: 'DISPONIBLE'
        images:
          type: array
          items:
            type: string

    CoberturasResponseV2:
      type: object
      properties:
        auto_id:
          type: string
        opciones:
          type: array
          items:
            type: object
            properties:
              tipo:
                type: string
                enum: [BASICA, TOTAL]
              nombre:
                type: string
              costo_adicional_diario:
                type: number
              franquicia:
                type: number
              deposito_garantia:
                type: number
              beneficios:
                type: array
                items:
                  type: string

    CreateAutoOrderRequestV2:
      type: object
      required:
        - vehicle_id
        - dias
        - tipo_cobertura
        - conductor
      properties:
        vehicle_id:
          type: string
          example: 'auto-spark-01'
        dias:
          type: integer
          example: 3
        tipo_cobertura:
          type: string
          enum: [BASICA, TOTAL]
          default: BASICA
        pickup_location:
          type: string
        dropoff_location:
          type: string
        pickup_date:
          type: string
        dropoff_date:
          type: string
        conductor:
          type: object
          required:
            - nombre
            - email
            - telefono
            - licencia_conducir
          properties:
            nombre:
              type: string
              example: 'Carlos Andrés Zambrano'
            email:
              type: string
              format: email
              example: 'carlos.zambrano@example.com'
            telefono:
              type: string
              example: '+593998765432'
            licencia_conducir:
              type: string
              example: '1723456789'
            pais_licencia:
              type: string
              example: 'Ecuador'
            edad:
              type: integer
              example: 32
            numero_vuelo:
              type: string
              example: 'AV1632'

    AutoOrderResponseV2:
      type: object
      properties:
        order_id:
          type: string
        pnr:
          type: string
          example: 'CAR7849B'
        status:
          type: string
          example: 'CONFIRMED'
        auto_id:
          type: string
        tipo_cobertura:
          type: string
          example: 'TOTAL'
        deposito_garantia:
          type: number
          example: 0.00
        total_price:
          type: object
          properties:
            currency:
              type: string
              example: 'USD'
            total:
              type: number
              example: 160.50
        voucher_qr_data:
          type: string
          example: 'BOOKING-CAR-CAR7849B-CONFIRMED'
        checklist_mostrador:
          type: array
          items:
            type: string
        _links:
          type: object

    RegistroMantenimientoRequestV2:
      type: object
      required:
        - kilometraje_registrado
        - nivel_combustible
        - tecnico_id
      properties:
        tecnico_id:
          type: string
          example: 'tec-rosero-01'
        kilometraje_registrado:
          type: integer
          example: 10250
        nivel_combustible:
          type: integer
          description: Porcentaje de combustible de 0 a 100
          example: 100
        condiciones_carroceria:
          type: string
          example: 'Sin abolladuras. Rasguño leve en paragolpes trasero derecho.'
        estado_neumaticos:
          type: string
          enum: [EXCELENTE, BUENO, REGULAR, REQUIERE_CAMBIO]
          default: BUENO
        observaciones:
          type: string
          example: 'Cambio de aceite y filtro realizado.'
        mantenimiento_realizado:
          type: boolean
          default: false
        nuevo_proximo_mantenimiento_km:
          type: integer
          example: 15000

    RegistroMantenimientoResponseV2:
      type: object
      properties:
        auto_id:
          type: string
        kilometraje_actual:
          type: integer
        proximo_mantenimiento_km:
          type: integer
        mantenimiento_requerido:
          type: boolean
          example: true
        alerta_preventiva:
          type: string
          example: 'ATENCIÓN: El vehículo ha superado el kilometraje programado. Retirar temporalmente de flota para revisión en taller.'
        timestamp:
          type: string
          format: date-time

  responses:
    ProblemDetails400:
      description: Solicitud incorrecta o parámetros de fecha/edad inválidos (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails401:
      description: No autorizado para operaciones técnicas de mantenimiento (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: Vehículo o reserva no encontrada (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: Conflicto de Idempotencia o vehículo en cooldown de limpieza (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails422:
      description: Error de entidad no procesable o licencia de conducir inválida (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails503:
      description: Agencia de alquiler externa no disponible (Circuit Breaker abierto) (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: 'https://api.booking.local/errors/vehicle-unavailable'
        title:
          type: string
          example: 'Vehículo No Disponible'
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: 'El vehículo está actualmente en cooldown de limpieza (2 horas).'
        instance:
          type: string
          example: '/api/v2/autos/search'
        code:
          type: string
          example: 'VEHICLE_IN_CLEANING_COOLDOWN'
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido para autenticación de usuarios y rol técnico (tecnico_mantenimiento)

