syntax = "proto3";

package inventory;

// ============================================================================
// SERVICIO gRPC INBOUND: InventoryStockService (Booking Prototipo - RDA2)
// ============================================================================
// Las tiendas individuales envían su stock hacia Booking mediante HTTP/2 (puerto 50051).
// Booking Prototipo consume/recibe inventario vía gRPC y se comunica hacia las tiendas vía REST.
service InventoryStockService {
  // Envío puntual unario de actualización de cupos
  rpc PushStockUpdate (StockUpdateMessage) returns (StockUpdateAck);

  // Streaming continuo de eventos de cambio de inventario
  rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);
}

message StockUpdateMessage {
  string service_id = 1;      // Identificador de la tienda (ej. "atracciones-dilan")
  string item_id = 2;         // ID del recurso en su vertical
  string date = 3;            // Fecha en formato YYYY-MM-DD
  string time_slot = 4;       // Franja horaria (ej. "10:30", "DEFAULT")
  int32 available_units = 5;  // Cupos remanentes disponibles
  int64 timestamp = 6;        // Epoch Unix timestamp en ms
  string resource_type = 7;   // Clasificación opcional (VUELO, AUTO, ATRACCION, ALOJAMIENTO)
  string correlation_id = 8;  // Correlation-ID universal
  string traceparent = 9;     // W3C Trace Context
}

message StockUpdateAck {
  bool success = 1;
  string message = 2;
  int64 processed_at = 3;
  string error_code = 4;
  string correlation_id = 5;
}

message StockChangeEvent {
  string event_id = 1;
  string service_id = 2;
  string item_id = 3;
  string date = 4;
  string time_slot = 5;
  int32 delta = 6;            // Variación neta (+1 liberación, -1 hold/compra)
  int64 timestamp = 7;
  string correlation_id = 8;
}

message StreamSummary {
  int32 total_events_processed = 1;
  bool is_synchronized = 2;
  string last_sync_hash = 3;
}
